<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>BimAutomation - Facebook Cover (820x312)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #020617;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      padding: 20px;
    }
    /* 820x312 Facebook Cover */
    .banner {
      width: 820px;
      height: 312px;
      background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      color: #fff;
    }
    .grid {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        linear-gradient(to right, rgba(37, 99, 235, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(37, 99, 235, 0.08) 1px, transparent 1px);
      background-size: 20px 20px;
      pointer-events: none;
    }
    .glow {
      position: absolute;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.25) 0%, transparent 70%);
      pointer-events: none;
      top: -50px; right: 50px;
    }
    .content {
      position: relative;
      z-index: 2;
      max-width: 500px;
    }
    .badge {
      display: inline-block;
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: #22d3ee;
      margin-bottom: 8px;
    }
    .title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 26px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 6px;
    }
    .title span { color: #38bdf8; }
    .desc {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .right-box {
      position: relative;
      z-index: 2;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px;
      border-radius: 10px;
      text-align: center;
      width: 200px;
    }
    .right-box .icon { font-size: 24px; margin-bottom: 4px; }
    .right-box .txt { font-size: 11px; color: #cbd5e1; font-weight: 500; }
    .right-box .link { font-size: 10px; color: #38bdf8; font-family: 'JetBrains Mono', monospace; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="banner">
    <div class="grid"></div>
    <div class="glow"></div>
    
    <div class="content">
      <div class="badge">Autodesk Revit 2022–2027</div>
      <h1 class="title">Gõ một câu.<br>Revit tự vẽ xong hệ thép.</h1>
      <p class="desc">Bộ 57 MCP Tools tự động hóa kết cấu bê tông cốt thép tuân thủ TCVN 5574:2018.</p>
    </div>

    <div class="right-box">
      <div class="icon">⚡</div>
      <div class="txt">Tab LDL-STRUCTURAL</div>
      <div class="link">bimautomation.vn</div>
    </div>
  </div>
</body>
</html>
