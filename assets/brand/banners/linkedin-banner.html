<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>BimAutomation - LinkedIn Cover Banner (1584x396)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #020617;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      padding: 20px;
    }
    /* 1584x396 LinkedIn Banner */
    .banner {
      width: 1584px;
      height: 396px;
      background: linear-gradient(135deg, #090f20 0%, #020617 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 80px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      color: #fff;
    }
    .grid {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        linear-gradient(to right, rgba(37, 99, 235, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(37, 99, 235, 0.08) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
    }
    .glow {
      position: absolute;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.2) 0%, transparent 70%);
      pointer-events: none;
      top: -100px; right: 200px;
    }
    .left-content {
      position: relative;
      z-index: 2;
      max-width: 800px;
    }
    .brand-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(6, 182, 212, 0.12);
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      color: #22d3ee;
      margin-bottom: 12px;
    }
    .title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.2;
      margin-bottom: 10px;
    }
    .title span { color: #38bdf8; }
    .desc {
      font-size: 15px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .right-badges {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: right;
    }
    .badge-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 20px;
      border-radius: 10px;
      backdrop-filter: blur(8px);
    }
    .badge-card strong {
      display: block;
      color: #ffffff;
      font-size: 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .badge-card span {
      font-size: 11px;
      color: #06b6d4;
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="grid"></div>
    <div class="glow"></div>
    
    <div class="left-content">
      <div class="brand-tag">⚡ BimAutomation • Tab LDL-STRUCTURAL</div>
      <h1 class="title">Revit<span>APP</span> — Tự Động Hóa Kết Cấu Bằng AI</h1>
      <p class="desc">Giải phóng 90% thời gian mô hình hóa cốt thép Cột, Dầm, Móng, Vách, Sàn theo TCVN 5574:2018.</p>
    </div>

    <div class="right-badges">
      <div class="badge-card">
        <strong>Autodesk Revit 2022–2027</strong>
        <span>Native C# .NET Engine</span>
      </div>
      <div class="badge-card">
        <strong>Model Context Protocol (MCP)</strong>
        <span>57 Tools for AI Reasoning</span>
      </div>
    </div>
  </div>
</body>
</html>
