<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Concrete Column Profile -->
  <rect x="10" y="6" width="28" height="36" rx="3" fill="#1E293B" stroke="#38BDF8" stroke-width="2" stroke-dasharray="2 2" />
  
  <!-- Main Vertical Rebars (4 corners + middles) -->
  <circle cx="15" cy="11" r="3" fill="#2563EB" stroke="#60A5FA" stroke-width="1.5" />
  <circle cx="33" cy="11" r="3" fill="#2563EB" stroke="#60A5FA" stroke-width="1.5" />
  <circle cx="15" cy="37" r="3" fill="#2563EB" stroke="#60A5FA" stroke-width="1.5" />
  <circle cx="33" cy="37" r="3" fill="#2563EB" stroke="#60A5FA" stroke-width="1.5" />
  <circle cx="15" cy="24" r="2.5" fill="#06B6D4" stroke="#67E8F9" stroke-width="1.2" />
  <circle cx="33" cy="24" r="2.5" fill="#06B6D4" stroke="#67E8F9" stroke-width="1.2" />

  <!-- Stirrup Tie Loop (Đai cột) -->
  <rect x="13" y="9" width="22" height="30" rx="2" fill="none" stroke="#22D3EE" stroke-width="2" />
  
  <!-- Cross Tie (Đai C) -->
  <line x1="15" y1="24" x2="33" y2="24" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" />
</svg>
