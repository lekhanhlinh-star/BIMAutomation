<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Shear Wall Outline (Vách bê tông cốt thép) -->
  <rect x="12" y="6" width="24" height="36" rx="2" fill="#1E293B" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3 2" />
  
  <!-- 2 Layers of Vertical Rebar (2 lớp thép đứng) -->
  <line x1="17" y1="9" x2="17" y2="39" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" />
  <line x1="31" y1="9" x2="31" y2="39" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" />

  <!-- Horizontal Distribution Bars (Thép ngang) -->
  <line x1="16" y1="13" x2="32" y2="13" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" />
  <line x1="16" y1="20" x2="32" y2="20" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" />
  <line x1="16" y1="27" x2="32" y2="27" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" />
  <line x1="16" y1="34" x2="32" y2="34" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" />

  <!-- Wall Ties (Móc C giữ 2 lớp thép vách) -->
  <circle cx="24" cy="20" r="2" fill="#F59E0B" />
  <circle cx="24" cy="27" r="2" fill="#F59E0B" />
</svg>
