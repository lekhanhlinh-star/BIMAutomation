<!DOCTYPE html>
<html lang="vi" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        const theme = localStorage.getItem('bimautomation_theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.dataset.theme = theme;
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BIMAutomation — Nền tảng Add-in Revit & Tự động hóa BIM hàng đầu</title>
    <meta name="description" content="BIMAutomation cung cấp bộ công cụ Add-in tự động hóa các thao tác Revit, giúp tiết kiệm thời gian, tối ưu quy trình BIM và nâng cao hiệu suất làm việc." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
