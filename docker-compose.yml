services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bimautomation_backend
    restart: always
    env_file:
      - .env
    environment:
      # Keep SQLite data in the named volume instead of the container layer.
      DATABASE_URL: sqlite+aiosqlite:///./data/app.db
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - backend_data:/app/data
    networks:
      - bimautomation_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bimautomation_frontend
    restart: always
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - bimautomation_net

networks:
  bimautomation_net:
    driver: bridge

volumes:
  backend_data:
