services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_backend
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      - APP_NAME=FastAPI Backend
      - ENVIRONMENT=development
      - DEBUG=True
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
