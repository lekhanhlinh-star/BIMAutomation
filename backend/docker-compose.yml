services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bimautomation_backend_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      - APP_NAME=BIMAutomation Backend
      - ENVIRONMENT=development
      - DEBUG=True
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite+aiosqlite:///./data/app.db
      - PYTHONUNBUFFERED=1
    volumes:
      - ./app:/app/app
      - backend_isolated_data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  backend_isolated_data:
